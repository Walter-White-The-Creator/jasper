<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Super Mario - Spel</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <header>
    <img src="../media/logo.png" alt="Super Mario logo" class="logo">
    <h1>Super Mario Wereld</h1>
  </header>

  <nav>
    <a href="../index.html">Home</a>
    <a href="game.html">Spel</a>
  </nav>

  <main>
    <h2>Sla op de blokken!</h2>
    <p>Klik op een ?-blok om een munt te laten verschijnen. Score: <span id="score">0</span></p>

    <div class="block-stage">
      <img src="../media/blocks.png" alt="Drie vraagteken blokken" class="block-img">
      <button type="button" class="block-btn" data-index="0" aria-label="Blok 1"></button>
      <button type="button" class="block-btn" data-index="1" aria-label="Blok 2"></button>
      <button type="button" class="block-btn" data-index="2" aria-label="Blok 3"></button>
    </div>
  </main>

  <footer>
    <table>
      <caption>Onze school</caption>
      <tr><th>Naam</th><td>School Voorbeeld</td></tr>
      <tr><th>Straat</th><td>Schoolstraat 1</td></tr>
      <tr><th>Gemeente</th><td>1000 Brussel</td></tr>
      <tr><th>Land</th><td>België</td></tr>
    </table>
  </footer>

  <script src="../js/app.js"></script>
</body>
</html>
