<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Super Mario - Spel</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <header>
    <img src="../media/logo.png" alt="Super Mario logo" class="logo">
    <h1>Super Mario Wereld</h1>
  </header>

  <nav>
    <a href="../index.html">Home</a>
    <a href="game.html">Spel</a>
  </nav>

  <main>
    <h2>Mario Mini Spel</h2>
    <p>Vul je gegevens in en start het avontuur!</p>

    <form id="gameForm" class="game-form">
      <label for="naam">Naam van speler:</label>
      <input type="text" id="naam" name="naam" placeholder="bv. Jasper" required>

      <label for="moeilijkheid">Moeilijkheidsgraad:</label>
      <select id="moeilijkheid" name="moeilijkheid">
        <option value="easy">Easy</option>
        <option value="medium">Medium</option>
        <option value="hard">Hard</option>
      </select>

      <label for="personage">Kies je personage:</label>
      <select id="personage" name="personage">
        <option value="Mario">Mario</option>
        <option value="Luigi">Luigi</option>
        <option value="Peach">Peach</option>
        <option value="Toad">Toad</option>
      </select>

      <label class="check">
        <input type="checkbox" id="cheats" name="cheats"> Cheats inschakelen
      </label>

      <button type="button" id="startBtn">Start spel</button>
    </form>

    <section id="output" class="output" aria-live="polite"></section>
  </main>

  <footer>
    <table>
      <caption>Onze school</caption>
      <tr><th>Naam</th><td>School Voorbeeld</td></tr>
      <tr><th>Straat</th><td>Schoolstraat 1</td></tr>
      <tr><th>Gemeente</th><td>1000 Brussel</td></tr>
      <tr><th>Land</th><td>België</td></tr>
    </table>
  </footer>

  <script src="../js/app.js"></script>
  
</body>
</html>
